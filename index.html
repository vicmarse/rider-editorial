<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RIDER – Editorial Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body{
      margin:0;
      background:transparent;
      overflow:hidden;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    }

    .viewer{
      width:100vw;
      height:100vh;
      background:transparent;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    /* PAGES */
    .pages-wrapper{
      flex:1;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .pages-wrapper::-webkit-scrollbar{ display:none; }

    .pages{
      display:flex;
      align-items:center;
      height:100%;
      padding: 0 60px 20px;
      gap:8px;
    }

    .page{
      flex:0 0 auto;
      height: 88%;
      scroll-snap-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .page img{
      height:100%;
      width:auto;
      object-fit:contain;
      border-radius:0;
      box-shadow:none;
      display:block;
      pointer-events:none;
    }

    /* OVERLAY UI (FLOATING) */
    .ui{
      position:absolute;
      inset:0;
      pointer-events:none; /* only children will receive when visible */
    }

    .ui .btn,
    .ui .meta{
      opacity:0;
      transition:opacity 0.22s ease;
      pointer-events:none;
    }

    /* show on hover */
    .viewer:hover .ui .btn,
    .viewer:hover .ui .meta{
      opacity:1;
      pointer-events:auto;
    }

    .ui .btn{
      position:absolute;
      background:rgba(0,0,0,0.55);
      border:none;
      color:#fff;
      padding:10px 12px;
      border-radius:6px;
      cursor:pointer;
      font-size:14px;
      line-height:1;
    }

    /* left arrow */
    #prev{
      left:16px;
      top:50%;
      transform:translateY(-50%);
    }

    /* right arrow */
    #next{
      right:16px;
      top:50%;
      transform:translateY(-50%);
    }

    /* top-right meta (counter + fullscreen) */
    .meta{
      position:absolute;
      top:14px;
      right:16px;
      display:flex;
      align-items:center;
      gap:10px;
      color:#fff;
      user-select:none;
      pointer-events:none;
    }

    #counter{
      font-size:12px;
      background:rgba(0,0,0,0.45);
      padding:6px 10px;
      border-radius:999px;
      pointer-events:none; /* purely informative */
    }

    #fs{
      background:rgba(0,0,0,0.55);
      border:none;
      color:#fff;
      padding:8px 10px;
      border-radius:8px;
      cursor:pointer;
      font-size:13px;
      line-height:1;
      pointer-events:auto; /* clickable */
    }

    /* PROGRESS (optional, also floating) */
    .progress{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:2px;
      background:rgba(255,255,255,0.2);
      opacity:0;
      transition:opacity 0.22s ease;
      pointer-events:none;
    }
    .viewer:hover .progress{ opacity:1; }

    .progress-bar{
      height:100%;
      width:0%;
      background:#fff;
      transition:width 0.15s ease;
    }
  </style>
</head>

<body>
  <div class="viewer" id="viewer">

    <div class="pages-wrapper" id="wrapper">
      <div class="pages" id="pages"></div>
    </div>

    <!-- FLOATING UI -->
    <div class="ui">
      <button class="btn" id="prev" title="Previous (←)">←</button>
      <button class="btn" id="next" title="Next (→)">→</button>

      <div class="meta">
        <div id="counter">1 / 72</div>
        <button id="fs" title="Fullscreen">⛶</button>
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progress"></div>
    </div>
  </div>

  <script>
    const TOTAL_PAGES = 72;

    const viewer = document.getElementById('viewer');
    const pagesEl = document.getElementById('pages');
    const wrapper = document.getElementById('wrapper');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');

    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const page = document.createElement('div');
      page.className = 'page';

      const img = document.createElement('img');
      img.src = `assets/pages/page-${String(i).padStart(3, '0')}.jpg`;
      img.loading = 'lazy';

      page.appendChild(img);
      pagesEl.appendChild(page);
    }

    function getCurrentIndex() {
      const pages = [...pagesEl.children];
      const center = wrapper.scrollLeft + wrapper.clientWidth / 2;
      let best = 0, dist = Infinity;

      pages.forEach((p, i) => {
        const c = p.offsetLeft + p.offsetWidth / 2;
        const d = Math.abs(c - center);
        if (d < dist) { dist = d; best = i; }
      });
      return best;
    }

    function goTo(idx) {
      const pages = pagesEl.children;
      idx = Math.max(0, Math.min(pages.length - 1, idx));
      pages[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function updateUI() {
      const max = wrapper.scrollWidth - wrapper.clientWidth;
      progress.style.width = max ? (wrapper.scrollLeft / max) * 100 + '%' : '0%';
      counter.textContent = `${getCurrentIndex() + 1} / ${TOTAL_PAGES}`;
    }

    wrapper.addEventListener('scroll', () => requestAnimationFrame(updateUI));

    document.getElementById('prev').onclick = () => goTo(getCurrentIndex() - 1);
    document.getElementById('next').onclick = () => goTo(getCurrentIndex() + 1);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') goTo(getCurrentIndex() + 1);
      if (e.key === 'ArrowLeft') goTo(getCurrentIndex() - 1);
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) viewer.requestFullscreen();
      else document.exitFullscreen();
    }
    document.getElementById('fs').onclick = toggleFullscreen;

    updateUI();
  </script>
</body>
</html>
